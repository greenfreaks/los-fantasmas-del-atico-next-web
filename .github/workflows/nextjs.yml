name: Deploy Next.js site to Pages

on:
  push:
    branches: ["develop_k8s"] # Ejecuta el build cuando subas cambios a master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Instalar pnpm (versión 10)
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # 2. Configurar Node.js con el caché de pnpm
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      # 3. Instalar dependencias
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 4. Compilar la aplicación Next.js
      - name: Build with Next.js
        run: pnpm run build

      # 5. Subir la carpeta de salida estática
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5